# LEVEL 0 multiplayer: included inside the `server { server_name lou15.com ... }` block.
# wss://lou15.com/level0-mp/ -> level0.service on 127.0.0.1:8823.
# backrooms.lou15.com (Cloudflare Worker) forwards /ws here and puts the player's
# address in X-Level0-IP for the per-address connection limit.
location ^~ /level0-mp/ {
    proxy_pass http://127.0.0.1:8823/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Level0-IP $http_x_level0_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 5s;
    proxy_buffering off;
    client_max_body_size 8k;
    access_log off;
    add_header Cache-Control "no-store" always;
}
